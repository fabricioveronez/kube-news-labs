# kube-news (Node/Express).
apiVersion: v1
kind: Service
metadata:
  name: kube-news
  namespace: kube-news
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/part-of: kube-news
spec:
  selector:
    app.kubernetes.io/name: kube-news
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-news
  namespace: kube-news
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/part-of: kube-news
  annotations:
    labs.k8s/commit: "6829194c26af768f5247fa509d695d7a7e74f296"
    labs.k8s/source: https://github.com/fabricioveronez/kube-news-labs
spec:
  # Uma replica de proposito. O schema e criado no boot por
  # sequelize.sync({ alter: true }), que emite DDL a cada start de cada
  # replica — N replicas subindo juntas disputam o mesmo ALTER.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-news
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-news
        app.kubernetes.io/part-of: kube-news
      annotations:
        labs.k8s/commit: "6829194c26af768f5247fa509d695d7a7e74f296"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      # A app conecta no banco durante o boot e MORRE se o DNS do Service ainda
      # nao resolver — o erro observado foi getaddrinfo ENOTFOUND, seguido de
      # crashloop ate o Postgres aparecer. Esperar aqui troca dois restarts por
      # um Init:0/1 legivel, e mantem o baseline do lab silencioso: num
      # ambiente onde restart e sinal de incidente, restart de partida ensina o
      # agente a ignorar o sinal.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            # -U explicito: o securityContext do pod vale para o initContainer,
            # e o UID 1001 nao existe no /etc/passwd da imagem do Postgres —
            # sem usuario do SO, o pg_isready devolve "no attempt" para sempre.
            - |
              until pg_isready -h postgres.kube-news.svc.cluster.local -p 5432 -U kubedevnews; do
                echo "aguardando postgres..."
                sleep 2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      containers:
        - name: kube-news
          image: docker.io/fabricioveronez/kube-news-labs:6829194
          imagePullPolicy: IfNotPresent
          ports:
            # 8080 e hardcoded em src/server.js (app.listen(8080)); a app nao
            # le process.env.PORT. O ENV PORT do Dockerfile e decorativo.
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kube-news-config
          env:
            - name: DB_DATABASE
              valueFrom: { secretKeyRef: { name: kube-news-db, key: POSTGRES_DB } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: kube-news-db, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: kube-news-db, key: POSTGRES_PASSWORD } }
          # /health nao toca o banco e responde {state:'up', machine:<hostname>}.
          # Cuidado ao investigar: PUT /unhealth liga um middleware global que
          # passa a devolver 500 em TODA rota, /health inclusive, e nao existe
          # endpoint para reverter — so reiniciando o pod. E o gatilho do
          # cenario probe-flap.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-news
  namespace: kube-news
  labels:
    app.kubernetes.io/part-of: kube-news
spec:
  ingressClassName: traefik
  rules:
    - host: kube-news.192.168.1.10.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-news
                port:
                  number: 80
