# Seed do kube-news.
#
# O repositorio nao tem migration nem seed automatizado: o schema nasce do
# sequelize.sync({alter:true}) no boot, e a carga inicial e manual, pelo
# arquivo popula-dados.http (feito para o REST Client do editor). Este Job faz
# a mesma chamada de dentro do cluster.
#
# A app nao verifica duplicata, entao o script confere a pagina inicial antes
# de postar — sem isso, uma reexecucao do Job (timeout, evicao do pod) inseria
# os 8 artigos de novo. O nome do Job carrega o short SHA porque spec.template
# de um Job e IMUTAVEL: com nome fixo, mudar o script faz o `kubectl apply`
# falhar com "field is immutable".
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-news-seed
  namespace: kube-news
  labels:
    app.kubernetes.io/part-of: kube-news
data:
  artigos.json: |
    {
      "artigos": [
        {
          "title": "Kubernetes na Nuvem",
          "resumo": "Gerencie contêineres na nuvem.",
          "description": "Saiba como utilizar o Kubernetes para orquestrar contêineres na nuvem, simplificando o gerenciamento de aplicações escaláveis."
        },
        {
          "title": "CI/CD para DevOps",
          "resumo": "Automatize o ciclo de vida de desenvolvimento e entrega.",
          "description": "Descubra como implementar integração contínua e entrega contínua (CI/CD) em ambientes DevOps para acelerar o desenvolvimento de software."
        },
        {
          "title": "Segurança na Nuvem",
          "resumo": "Proteja suas aplicações e dados na nuvem.",
          "description": "Saiba como garantir a segurança de suas aplicações e informações ao adotar soluções de computação em nuvem."
        },
        {
          "title": "Automatização de Infraestrutura",
          "resumo": "Automatize o provisionamento de recursos na nuvem.",
          "description": "Aprenda a usar ferramentas de automação para criar, gerenciar e escalar infraestrutura na nuvem de forma eficiente."
        },
        {
          "title": "Monitoramento na Nuvem",
          "resumo": "Obtenha visibilidade completa de suas aplicações na nuvem.",
          "description": "Descubra a importância do monitoramento de aplicações e infraestrutura na nuvem e como isso pode melhorar o desempenho e a confiabilidade."
        },
        {
          "title": "Containers vs. VMs",
          "resumo": "Comparando tecnologias de virtualização.",
          "description": "Explore as diferenças entre contêineres e máquinas virtuais (VMs) e quando usar cada uma para otimizar sua infraestrutura."
        },
        {
          "title": "Estratégias de Implantação na Nuvem",
          "resumo": "Escolha a abordagem certa para suas aplicações.",
          "description": "Aprenda sobre diferentes estratégias de implantação na nuvem, como IaaS, PaaS e SaaS, e como selecionar a mais adequada para suas necessidades."
        },
        {
          "title": "DevOps como Cultura Organizacional",
          "resumo": "Transforme sua empresa com DevOps.",
          "description": "Descubra como adotar DevOps como uma cultura organizacional pode melhorar a colaboração entre equipes e acelerar o desenvolvimento de software."
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-news-seed-6829194
  namespace: kube-news
  labels:
    app.kubernetes.io/name: kube-news-seed
    app.kubernetes.io/part-of: kube-news
spec:
  backoffLimit: 10
  # Jobs concluidos nao sao coletados sozinhos, e o nome carrega o SHA do
  # commit: sem TTL, cada deploy deixa mais um Job Complete no namespace e
  # o `kubectl get pods` vira ruido que compete com sinal de incidente.
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-news-seed
        app.kubernetes.io/part-of: kube-news
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              BASE=http://kube-news.kube-news.svc.cluster.local
              until curl -sf -m 5 "$BASE/ready"; do
                echo "aguardando kube-news ficar ready..."
                sleep 3
              done
              # Guarda de idempotencia. A app nao verifica duplicata e o POST e
              # em lote: uma reexecucao do Job (timeout, evicao do pod) insere
              # os 8 artigos de novo. Nao ha endpoint de contagem, entao a
              # verificacao e pela pagina inicial, que lista os posts.
              if curl -sf -m 10 "$BASE/" | grep -q 'Kubernetes na Nuvem'; then
                echo "banco ja populado, nada a fazer"
                exit 0
              fi

              curl -sS --fail-with-body -X POST "$BASE/api/post" \
                -H 'Content-Type: application/json' \
                --data @/seed/artigos.json
              echo "seed concluido"
          volumeMounts:
            - name: seed
              mountPath: /seed
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: seed
          configMap:
            name: kube-news-seed
